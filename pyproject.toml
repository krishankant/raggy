[project]
name = "raggy"
version = "0.1.0"
description = "A RAG pipeline you read, run and keep: built one week at a time."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.2.0",
    "fastembed>=0.9.0",
    "httpx>=0.28",
    "lancedb>=0.40",
    "numpy>=2.0",
    "openai>=3.37.0",
    "openpyxl>=3.1.5",
    "pathspec>=1.1",
    "pdfplumber>=0.11.10",
    "pypdf>=6.21",
    "python-docx>=1.2",
    "python-dotenv>=1.2.4",
    "python-pptx>=1.0.2",
    "rapidocr>=3.10",
    "tokenizers>=0.23",
    "trafilatura>=2.3.1",
]

[project.scripts]
raggy = "raggy.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "reportlab>=5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["raggy"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
